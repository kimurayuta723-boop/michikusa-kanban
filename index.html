<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>みちくさ看板</title>
  <meta name="description" content="散歩で見つけたかわいい看板を集める、自分だけの看板図鑑">
  <meta name="theme-color" content="#FBF6EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="みちくさ看板">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <div id="mapView" class="map-view" hidden>
      <div id="map" class="map"></div>
      <div class="map-top">
        <div class="pill" id="mapCount">この辺の看板 <b>0</b></div>
        <button class="round-btn" id="locateBtn" aria-label="現在地に戻る">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>
      <div class="map-card" id="mapCard" hidden></div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="メイン">
      <a href="#/zukan" class="tab" data-tab="zukan">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        図鑑
      </a>
      <button class="shoot" id="shootBtn" aria-label="看板を撮る">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <a href="#/map" class="tab" data-tab="map">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
        地図
      </a>
    </nav>
  </div>

  <!-- 登録フロー(切り抜き→タグ) -->
  <section id="flow" class="flow" hidden></section>
  <!-- 下から出るシート -->
  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></section>
  <div id="toast" class="toast" hidden></div>

  <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="libInput" accept="image/*" hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
